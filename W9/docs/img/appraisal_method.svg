<rect x="610" y="390" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="736.0" y="417.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Sewerage and</text><text x="736.0" y="443.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">connection</text><text x="736.0" y="468.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">charges, if NWS levies</text><text x="736.0" y="494.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">them</text>
<rect x="902" y="390" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="1028.0" y="417.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Avoided cost: tankers,</text><text x="1028.0" y="443.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">septic</text><text x="1028.0" y="468.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">emptying, deferring a</text><text x="1028.0" y="494.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">plant</text>
<rect x="1194" y="390" width="252" height="118" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="1320.0" y="443.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 3  Revenue and</text><text x="1320.0" y="468.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">avoided cost</text>
<rect x="26" y="548" width="1420" height="118" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="736.0" y="601.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 4   Discount every flow back to today at 5 % over 25 years:  NET PRESENT VALUE and LIFE-CYCLE COST</text><text x="736.0" y="626.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Payback is reported alongside them, but it does not decide.</text>
