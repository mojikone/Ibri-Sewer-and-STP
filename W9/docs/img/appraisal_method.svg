<rect x="26" y="74" width="252" height="434" rx="9" fill="#FFFFFF" stroke="#2E629E" stroke-width="1.8"/><text x="152.0" y="208.4875" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">THREE OPTIONS</text><text x="152.0" y="234.1125" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">for each system,</text><text x="152.0" y="259.7375" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">plus OPTION 0,</text><text x="152.0" y="285.3625" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">do nothing.</text><text x="152.0" y="310.9875" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle"></text><text x="152.0" y="336.6125" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">Each is costed</text><text x="152.0" y="362.2375" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">separately, on</text><text x="152.0" y="387.8625" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">the same basis.</text>
<rect x="318" y="74" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="444.0" y="114.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Gravity sewers by</text><text x="444.0" y="140.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">diameter AND depth</text><text x="444.0" y="165.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">band</text>
<rect x="610" y="74" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="736.0" y="101.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Manholes, house</text><text x="736.0" y="127.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">connections,</text><text x="736.0" y="152.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">force mains, lifting</text><text x="736.0" y="178.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">stations</text>
<rect x="902" y="74" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="1028.0" y="114.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STP per m3/day, TE</text><text x="1028.0" y="140.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">network,</text><text x="1028.0" y="165.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">land, NOCs, diversions</text>
<rect x="1194" y="74" width="252" height="118" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="1320.0" y="127.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 1  CAPEX</text><text x="1320.0" y="152.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">phased over the build</text>
<rect x="318" y="232" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="444.0" y="285.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Energy: pumping, and</text><text x="444.0" y="310.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">aeration at the plant</text>
<rect x="610" y="232" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="736.0" y="272.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Sludge, chemicals,</text><text x="736.0" y="298.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">labour,</text><text x="736.0" y="323.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">jetting and CCTV</text>
<rect x="902" y="232" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="1028.0" y="272.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Replacing M and E</text><text x="1028.0" y="298.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">plant</text><text x="1028.0" y="323.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">inside the 25 years</text>
<rect x="1194" y="232" width="252" height="118" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="1320.0" y="285.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 2  OPEX</text><text x="1320.0" y="310.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">built bottom-up</text>
