<rect x="318" y="706" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="444.0" y="746.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 6</text><text x="444.0" y="772.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Apply the weights</text><text x="444.0" y="797.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">NWS sets</text>
<rect x="610" y="706" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="736.0" y="733.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 7</text><text x="736.0" y="759.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Sensitivity: weights,</text><text x="736.0" y="784.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">discount rate,</text><text x="736.0" y="810.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">criteria</text>
<rect x="902" y="706" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="1028.0" y="733.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 8</text><text x="1028.0" y="759.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Within 10 % on cost,</text><text x="1028.0" y="784.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">the greener option</text><text x="1028.0" y="810.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">wins</text>
<rect x="1194" y="706" width="252" height="118" rx="9" fill="#1F3B63" stroke="#1F3B63" stroke-width="1.8"/><text x="1320.0" y="746.55" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 9</text><text x="1320.0" y="772.175" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">RECOMMENDED OPTION,</text><text x="1320.0" y="797.8" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">one for each system</text>
