<rect x="72" y="120" width="252" height="434" rx="9" fill="#FFFFFF" stroke="#2E629E" stroke-width="1.8"/><text x="198.0" y="254.4875" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">THREE OPTIONS</text><text x="198.0" y="280.1125" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">for each system,</text><text x="198.0" y="305.7375" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">plus OPTION 0,</text><text x="198.0" y="331.3625" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">do nothing.</text><text x="198.0" y="356.9875" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle"></text><text x="198.0" y="382.6125" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">Each is costed</text><text x="198.0" y="408.2375" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">separately, on</text><text x="198.0" y="433.8625" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">the same basis.</text>
<rect x="364" y="120" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="490.0" y="160.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Gravity sewers by</text><text x="490.0" y="186.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">diameter AND depth</text><text x="490.0" y="211.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">band</text>
<rect x="656" y="120" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="782.0" y="147.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Manholes, house</text><text x="782.0" y="173.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">connections,</text><text x="782.0" y="198.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">force mains, lifting</text><text x="782.0" y="224.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">stations</text>
<rect x="948" y="120" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="1074.0" y="160.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STP per m3/day, TE</text><text x="1074.0" y="186.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">network,</text><text x="1074.0" y="211.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">land, NOCs, diversions</text>
<rect x="1240" y="120" width="252" height="118" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="1366.0" y="173.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 1  CAPEX</text><text x="1366.0" y="198.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">phased over the build</text>
<rect x="364" y="278" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="490.0" y="331.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Energy: pumping, and</text><text x="490.0" y="356.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">aeration at the plant</text>
<rect x="656" y="278" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="782.0" y="318.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Sludge, chemicals,</text><text x="782.0" y="344.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">labour,</text><text x="782.0" y="369.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">jetting and CCTV</text>
<rect x="948" y="278" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="1074.0" y="318.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Replacing M and E</text><text x="1074.0" y="344.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">plant</text><text x="1074.0" y="369.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">inside the 25 years</text>
<rect x="1240" y="278" width="252" height="118" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="1366.0" y="331.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 2  OPEX</text><text x="1366.0" y="356.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">built bottom-up</text>
<rect x="364" y="436" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="490.0" y="476.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Treated effluent sold,</text><text x="490.0" y="502.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">capped by irrigation</text><text x="490.0" y="527.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">demand</text>
<rect x="656" y="436" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="782.0" y="463.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Sewerage and</text><text x="782.0" y="489.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">connection</text><text x="782.0" y="514.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">charges, if NWS levies</text><text x="782.0" y="540.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">them</text>
<rect x="948" y="436" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="1074.0" y="463.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Avoided cost: tankers,</text><text x="1074.0" y="489.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">septic</text><text x="1074.0" y="514.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">emptying, deferring a</text><text x="1074.0" y="540.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">plant</text>
<rect x="1240" y="436" width="252" height="118" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="1366.0" y="489.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 3  Revenue and</text><text x="1366.0" y="514.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">avoided cost</text>
<rect x="72" y="594" width="1420" height="118" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="782.0" y="647.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 4   Discount every flow back to today at 5 % over 25 years:  NET PRESENT VALUE and LIFE-CYCLE COST</text><text x="782.0" y="672.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Payback is reported alongside them, but it does not decide.</text>
<rect x="72" y="752" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="198.0" y="792.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 5</text><text x="198.0" y="818.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Score the</text><text x="198.0" y="843.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">seven criteria</text>
<rect x="364" y="752" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="490.0" y="792.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 6</text><text x="490.0" y="818.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Apply the weights</text><text x="490.0" y="843.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">NWS sets</text>
<rect x="656" y="752" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="782.0" y="779.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 7</text><text x="782.0" y="805.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Sensitivity: weights,</text><text x="782.0" y="830.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">discount rate,</text><text x="782.0" y="856.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">criteria</text>
<rect x="948" y="752" width="252" height="118" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="1074.0" y="779.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">STEP 8</text><text x="1074.0" y="805.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Within 10 % on cost,</text><text x="1074.0" y="830.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">the greener option</text><text x="1074.0" y="856.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">wins</text>
<rect x="1240" y="752" width="252" height="118" rx="9" fill="#1F3B63" stroke="#1F3B63" stroke-width="1.8"/><text x="1366.0" y="792.55" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 9</text><text x="1366.0" y="818.175" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">RECOMMENDED OPTION,</text><text x="1366.0" y="843.8" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">one for each system</text>
