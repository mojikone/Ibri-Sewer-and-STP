<rect x="330" y="354" width="258" height="108" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="459.0" y="389.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Set gradient</text><text x="459.0" y="415.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">not below the Table 11</text><text x="459.0" y="440.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">minimum</text>
<rect x="26" y="494" width="258" height="108" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="155.0" y="542.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Velocity above 0.75 m/s</text><text x="155.0" y="567.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">AT PEAK FLOW</text>
