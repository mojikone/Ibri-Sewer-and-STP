<text x="155.0" y="99.7875" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">Table 11 gradients deliver</text><text x="155.0" y="122.9125" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">0.75 m/s FULL BORE. The</text><text x="155.0" y="146.0375" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">rule is</text><text x="155.0" y="169.1625" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">at peak flow. Check both.</text>
<rect x="634" y="74" width="258" height="108" rx="6" fill="#FFF4E5" stroke="#D9A441" stroke-width="1.4"/>
<text x="763.0" y="111.35" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">No value of shear stress</text><text x="763.0" y="134.475" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">in pascals exists in any</text><text x="763.0" y="157.6" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">NWS guideline. Agree one.</text>
