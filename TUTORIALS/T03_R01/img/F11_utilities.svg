<rect x="26" y="74" width="258" height="108" rx="6" fill="#FFF4E5" stroke="#D9A441" stroke-width="1.4"/>
<text x="155.0" y="99.7875" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">We hold electricity METER</text><text x="155.0" y="122.9125" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">POINTS, not cable routes.</text><text x="155.0" y="146.0375" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">Telecom and gas are</text><text x="155.0" y="169.1625" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">absent.</text>
<rect x="634" y="74" width="258" height="108" rx="6" fill="#FFF4E5" stroke="#D9A441" stroke-width="1.4"/>
<text x="763.0" y="88.225" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">Sewer crosses UNDER a</text><text x="763.0" y="111.35" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">water</text><text x="763.0" y="134.475" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">main, 450 mm clear, and 3</text><text x="763.0" y="157.6" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">m</text><text x="763.0" y="180.725" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">horizontal separation.</text>
