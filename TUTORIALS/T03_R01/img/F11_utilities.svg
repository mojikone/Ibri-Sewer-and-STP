<rect x="330" y="354" width="258" height="108" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="459.0" y="376.7375" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Trial pit at the</text><text x="459.0" y="402.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">critical</text><text x="459.0" y="427.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">crossings and</text><text x="459.0" y="453.6125" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">intersections</text>
<rect x="330" y="494" width="258" height="108" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="459.0" y="529.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Can the sewer be re-</text><text x="459.0" y="555.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">routed</text><text x="459.0" y="580.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">within the corridor?</text>
