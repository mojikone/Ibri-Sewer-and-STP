<svg xmlns="http://www.w3.org/2000/svg" width="924" height="656" viewBox="0 0 924 656" font-family="Helvetica">
<rect width="924" height="656" fill="#FFFFFF"/>
<text x="26" y="52" font-family="Helvetica" font-size="27" font-weight="600" fill="#1F3B63">When a lifting station is required</text>
<path d="M462.0,186.0 L462.0,211.0" fill="none" stroke="#8A9BB0" stroke-width="1.8" stroke-linejoin="round"/><polygon points="462.0,222.0 457.4,211.0 466.6,211.0" fill="#8A9BB0"/>
<path d="M462.0,334.0 L462.0,352.0 L156.0,352.0 L156.0,359.0" fill="none" stroke="#8A9BB0" stroke-width="1.8" stroke-linejoin="round"/><polygon points="156.0,370.0 151.4,359.0 160.6,359.0" fill="#8A9BB0"/><rect x="292.6" y="339.0" width="32.8" height="26" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="309.0" y="358.0" font-family="Helvetica" font-size="17" fill="#5A5A5A" text-anchor="middle">no</text>
<path d="M462.0,334.0 L462.0,352.0 L768.0,352.0 L768.0,359.0" fill="none" stroke="#8A9BB0" stroke-width="1.8" stroke-linejoin="round"/><polygon points="768.0,370.0 763.4,359.0 772.6,359.0" fill="#8A9BB0"/><rect x="593.9" y="339.0" width="42.2" height="26" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="615.0" y="358.0" font-family="Helvetica" font-size="17" fill="#5A5A5A" text-anchor="middle">yes</text>
<path d="M156.0,482.0 L156.0,500.0 L462.0,500.0 L462.0,507.0" fill="none" stroke="#8A9BB0" stroke-width="1.8" stroke-linejoin="round"/><polygon points="462.0,518.0 457.4,507.0 466.6,507.0" fill="#8A9BB0"/>
<path d="M768.0,482.0 L768.0,500.0 L462.0,500.0 L462.0,507.0" fill="none" stroke="#8A9BB0" stroke-width="1.8" stroke-linejoin="round"/><polygon points="462.0,518.0 457.4,507.0 466.6,507.0" fill="#8A9BB0"/>
<rect x="332" y="74" width="260" height="112" rx="9" fill="#FFFFFF" stroke="#2E629E" stroke-width="1.8"/><text x="462.0" y="124.3625" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">Gravity route</text><text x="462.0" y="149.9875" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#1F3B63" text-anchor="middle">considered first</text>
<rect x="332" y="222" width="260" height="112" rx="9" fill="#EAF1F8" stroke="#2E629E" stroke-width="1.8"/><text x="462.0" y="272.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Is excavation cost</text><text x="462.0" y="297.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">becoming prohibitive?</text>
<rect x="26" y="370" width="260" height="112" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="156.0" y="420.3625" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Stay in gravity</text><text x="156.0" y="445.9875" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">re-search the route</text>
<rect x="638" y="370" width="260" height="112" rx="9" fill="#FFFFFF" stroke="#8A9BB0" stroke-width="1.8"/><text x="768.0" y="407.55" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">Lifting station</text><text x="768.0" y="433.175" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">+ force main to the</text><text x="768.0" y="458.8" font-family="Helvetica" font-size="20.5" font-weight="400" fill="#1A1A1A" text-anchor="middle">nearest gravity point</text>
<rect x="332" y="518" width="260" height="112" rx="9" fill="#1F3B63" stroke="#1F3B63" stroke-width="1.8"/><text x="462.0" y="568.3625" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continue by gravity to</text><text x="462.0" y="593.9875" font-family="Helvetica" font-size="20.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">the outfall</text>
<rect x="26" y="74" width="260" height="112" rx="6" fill="#FFF4E5" stroke="#D9A441" stroke-width="1.4"/>
<text x="156.0" y="101.7875" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">The trigger is COST,</text><text x="156.0" y="124.9125" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">not depth. 10 to 12 m is</text><text x="156.0" y="148.0375" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">a recommendation about</text><text x="156.0" y="171.1625" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">cover.</text>
<rect x="638" y="74" width="260" height="112" rx="6" fill="#FFF4E5" stroke="#D9A441" stroke-width="1.4"/>
<text x="768.0" y="101.7875" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">The guideline requires</text><text x="768.0" y="124.9125" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">pumping be avoided</text><text x="768.0" y="148.0375" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">wherever</text><text x="768.0" y="171.1625" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">gravity is feasible.</text>
</svg>