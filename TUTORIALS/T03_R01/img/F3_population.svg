<rect x="332" y="524" width="260" height="114" rx="6" fill="#FFF4E5" stroke="#D9A441" stroke-width="1.4"/>
<text x="462.0" y="541.225" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">Both routes are required,</text><text x="462.0" y="564.35" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">and the guideline asks</text><text x="462.0" y="587.475" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">that they be reconciled</text><text x="462.0" y="610.6" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">with NWS where they</text><text x="462.0" y="633.725" font-family="Helvetica" font-size="18.5" font-weight="400" fill="#7A5200" text-anchor="middle">disagree</text>
